<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅程 · 黄翀与的旅程</title>
<meta name="description" content="一趟旅程的照片、坐标与本末：封面、错版照片墙、地图和上下篇。">
<link rel="canonical" href="https://shackle0412.vip/journey.html">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/layout.css">

<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/vendor/MarkerCluster.css">

<body class="page--wide" data-page="journey">

<a class="skip" href="#main">跳到主内容</a>

<header class="nav" id="top">
  <a class="nav__brand" href="/">黄翀与的旅程</a>
  <nav class="nav__links" aria-label="主导航">
    <a href="/journeys.html" aria-current="page">旅程</a>
    <a href="/map.html">地图</a>
    <a href="/photos.html">照片</a>
    <a href="/notes.html">笔记</a>
    <a href="/about">关于</a>
  </nav>
</header>

<main id="main">
  <div class="sheet c-full">
    <div class="c-12">

      <div class="page-head">
        <p class="page-head__kicker" id="trip-sub">旅程</p>
        <h1 class="page-head__title" id="trip-title">正在翻开这一趟…</h1>
        <p class="page-head__desc" id="trip-desc"></p>
        <p class="page-head__meta" id="trip-meta"></p>
      </div>

      <div class="journey-hero" id="trip-hero"></div>

      <div class="wall wall--mosaic" id="trip-wall"></div>

      <nav class="pager" id="trip-pager" aria-label="前后旅程"></nav>

    </div>
  </div>

  <section class="band band--soft band--bleed" id="trip-map-band">
    <div class="band__inner">
      <div class="head">
        <div>
          <p class="head__no">坐标</p>
          <h2 class="head__title">这一趟的点</h2>
          <p class="head__sub">按拍摄位置落的点</p>
        </div>
        <span class="head__more">点图标看照片</span>
      </div>
      <div class="map" id="trip-map"></div>
    </div>
  </section>

  <footer class="colophon band--bleed">
    <div class="band__inner colophon__grid">
      <div>
        <p class="colophon__brand">黄翀与的旅程</p>
        <p class="colophon__line">走到哪儿，拍到哪儿。照片与文字均为本人拍摄整理。</p>
      </div>
      <div>
        <p class="colophon__head">本期</p>
        <p class="colophon__line" id="colophon-stats">—</p>
      </div>
      <div>
        <p class="colophon__head">栏目</p>
        <p class="colophon__line">
          <a href="/journeys.html">旅程</a> · <a href="/map.html">地图</a> ·
          <a href="/photos.html">照片</a> · <a href="/notes.html">笔记</a> ·
          <a href="/about">关于</a>
        </p>
      </div>
      <div>
        <p class="colophon__head">站点</p>
        <p class="colophon__line">
          <a href="https://shackle0412.vip/">shackle0412.vip</a><br>
          © <span id="year">2026</span> 黄翀与<br>
          <a href="#top">回到顶部 ↑</a>
        </p>
      </div>
    </div>
  </footer>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片大图" hidden>
  <button class="lightbox__close" type="button" id="lightbox-close" aria-label="关闭">×</button>
  <img id="lightbox-img" alt="">
  <p class="lightbox__cap" id="lightbox-cap"></p>
</div>

<script src="/vendor/leaflet.js"></script>
<script src="/vendor/leaflet.markercluster.js"></script>
<script src="/pages.js"></script>
</body>
</html>
